app-id: id.tirsasaki.bukuhutang
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/buku-hutang/cargo
modules:
  - name: buku-hutang
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/tirsasaki/buku-hutang.git
        tag: v0.1.1
      - cargo-sources.json
    build-commands:
      - cd src-tauri && cargo build --release --offline
      - install -Dm755 src-tauri/target/release/app /app/bin/app
      - install -Dm644 src-tauri/id.tirsasaki.bukuhutang.desktop /app/share/applications/id.tirsasaki.bukuhutang.desktop
      - install -Dm644 src-tauri/appstream/id.tirsasaki.bukuhutang.appdata.xml /app/share/metainfo/id.tirsasaki.bukuhutang.appdata.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/id.tirsasaki.bukuhutang.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/id.tirsasaki.bukuhutang.png